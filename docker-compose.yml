# The music bot, on its own.
#
# Its own compose project, like the support bot beside it: it shares no network, no volume
# and no database with the community server, and it talks to Core over the public internet
# exactly as a bot written by anybody else would.
#
# This file is also part of the worked example. A bot needs a container, two secrets and
# nothing else. See README.md.

services:
  music-bot:
    build: .
    restart: unless-stopped
    environment:
      # Core mints the per-server tokens, so this is Core's URL, not a community's. The
      # bot asks Core which communities it has been added to and opens a socket to each.
      #
      # No default. A default here is a staging box quietly authenticating against
      # production and playing in production communities, which is not a failure anybody
      # would notice quickly.
      CORE_SERVER_URL: "${CORE_SERVER_URL:?set CORE_SERVER_URL to the Core this bot should use}"
      # Quoted: the message after "?" contains a colon, which unquoted ends the YAML
      # mapping value and makes compose refuse to parse the file at all.
      BOT_KEY: "${BOT_KEY:?create a bot in Settings, Bots and set BOT_KEY}"
      BOT_SECRET: "${BOT_SECRET:?BOT_SECRET is shown once, when the bot is created}"
    # No ports and no EXPOSE. The bot dials out; nothing ever connects to it.
    #
    # Its log is capped: a bot that cannot reach Core logs every retry, and an unbounded
    # json-file driver is how a small box fills its disk overnight. This one also logs a
    # line per track, which on a busy evening is not nothing.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
